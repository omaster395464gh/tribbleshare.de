  emby:
    image: emby/embyserver
    container_name: emby
    restart: unless-stopped
    #runtime: nvidia # Expose NVIDIA GPUs
    #network_mode: host # Enable DLNA and Wake-on-Lan
    environment:
      - UID=1000 # The UID to run emby as (default: 2)
      - GID=1000 # The GID to run emby as (default 2)
      - GIDLIST=1000 # A comma-separated list of additional GIDs to run emby as (default: 2)
    volumes:
      - ./emby_data/config:/config # Configuration directory
      - ./emby_data/demo:/mnt/demo # Media directory
      - ./emby_data/shows:/mnt/shows # Media directory
      - ./emby_data/movies:/mnt/movies # Media directory
      - ./emby_data/music:/mnt/music # Media directory
      - /Multimedia:/mnt/Multimedia # extern
    ports:
      - "8096:8096" # HTTP port
      # - 8920:8920 # HTTPS port
    # devices:
      # - /dev/dri:/dev/dri # VAAPI/NVDEC/NVENC render nodes
      # - /dev/vchiq:/dev/vchiq # MMAL/OMX on Raspberry Pi
    labels:
      - homepage.group=Media
      - homepage.name=Emby
      - homepage.icon=emby.png
      - homepage.href=http://tribbleshare.follow-inconnu.ts.net:8096/
      - homepage.description=Filme + Serien
      - homepage.widget.type=emby
      - homepage.widget.url=http://tribbleshare.follow-inconnu.ts.net:8096/
      - homepage.widget.key=${EMBY_KEY}
      - homepage.widget.enableBlocks=true # optional, defaults to false
      - homepage.widget.enableNowPlaying=true # optional, defaults to true
      - homepage.widget.enableUser=true # optional, defaults to false
      - homepage.widget.enableMediaControl=false # optional, defaults to true
      - homepage.widget.showEpisodeNumber=true # optional, defaults to false
      - homepage.widget.expandOneStreamToTwoRows=false # optional, defaults to true
  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest #
    container_name: mealie
    restart: unless-stopped
    ports:
      - "9925:9000" #
    deploy:
      resources:
        limits:
          memory: 1000M #
    volumes:
      - ./mealie_data:/app/data
      - ./certs:/app/certs:ro
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: "Europe/Berlin"
      BASE_URL: https://tribbleshare.follow-inconnu.ts.net:9925/
      # 396h Token time
      TOKEN_TIME: 9504
      TLS_CERTIFICATE_PATH: /app/certs/tribbleshare.follow-inconnu.ts.net.crt
      TLS_PRIVATE_KEY_PATH: /app/certs/tribbleshare.follow-inconnu.ts.net.key
    labels:
      - homepage.group=Media
      - homepage.name=Mealie
      - homepage.icon=mealie.png
      - homepage.href=https://tribbleshare.follow-inconnu.ts.net:9925/
      - homepage.description=Rezept Manager
      - homepage.widget.type=mealie
      - homepage.widget.url=https://tribbleshare.follow-inconnu.ts.net:9925/
      - homepage.widget.key=${MEALIE_KEY}
      - homepage.widget.version=2

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    ports:
      - 9978:80
    volumes:
      - ./data_audiobookshelf/audiobooks:/audiobooks
      - ./data_audiobookshelf/podcasts:/podcasts
      - ./data_audiobookshelf/config:/config
      - ./data_audiobookshelf/metadata:/metadata
    # set user 1000
    # https://github.com/advplyr/audiobookshelf/issues/3527:
    user: 1000:1000
    environment:
      - TZ=Europe/Berlin
    labels:
      - homepage.group=Media
      - homepage.name=AudioBookShelf
      - homepage.icon=audiobookshelf.png
      - homepage.href=http://tribbleshare.follow-inconnu.ts.net:9978/
      - homepage.description=Self-hosted audiobook and podcast server
      - homepage.widget.type=audiobookshelf
      - homepage.widget.url=http://tribbleshare.follow-inconnu.ts.net:9978/
      - homepage.widget.key=${AUDIOBOOKSHELF_KEY}
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - 80:3000
    volumes:
      - ./homepage_config:/app/config # Make sure your local config directory exists
    environment:
      HOMEPAGE_ALLOWED_HOSTS: tribbleshare.follow-inconnu.ts.net
      PUID: 1000
      PGID: 1000
    labels:
      - homepage.group=Media
      - homepage.name=Homepage
      - homepage.icon=homepage.png
      - homepage.href=http://tribbleshare.follow-inconnu.ts.net/
      - homepage.description=Aktuelle Seite
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1 # Allow access to viewing containers
      - SERVICES=1 # Allow access to viewing services (necessary when using Docker Swarm)
      - TASKS=1 # Allow access to viewing tasks (necessary when using Docker Swarm)
      - POST=0 # Disallow any POST operations (effectively read-only)
    ports:
      - 127.0.0.1:2375:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro # Mounted as read-only
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 9999:8080
    environment:
    - DOZZLE_NO_ANALYTICS=true
      # Uncomment to enable container actions (stop, start, restart). See https://dozzle.dev/guide/actions
      # - DOZZLE_ENABLE_ACTIONS=true
      #
      # Uncomment to allow access to container shells. See https://dozzle.dev/guide/shell
      # - DOZZLE_ENABLE_SHELL=true
      #
      # Uncomment to enable authentication. See https://dozzle.dev/guide/authentication
      # - DOZZLE_AUTH_PROVIDER=simple
    labels:
      - homepage.group=Media
      - homepage.name=Dozzle
      - homepage.icon=dozzle.png
      - homepage.href=http://tribbleshare.follow-inconnu.ts.net:9999/
      - homepage.description=Simple Container Monitoring and Logging
  calibre:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre
    environment:
      # Only change these if you know what you're doing
      - PUID=1000
      - PGID=1000
      # Edit to match your current timezone e.g. Europe/London, America/New_York - https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=Europe/Berlin
      # Hardcover API Key required for Hardcover as a Metadata Provider, get one here: https://docs.hardcover.app/api/getting-started/
      # - HARDCOVER_TOKEN=your_hardcover_api_key_here
      # If your library is on a network share (e.g., NFS/SMB), disable WAL to reduce locking issues
      # Accepts: true/false (default: false)
      - NETWORK_SHARE_MODE=true
      # Override the default port (8083) for the web server.
      # Accepts any valid port number.
      - CWA_PORT_OVERRIDE=8083
    volumes:
      # CW users migrating should stop their existing CW instance, make a copy of the config folder, and bind that here to carry over all of their user settings ect.
      - ./calibre/config:/config
      # This is an ingest dir, NOT a library one. Anything added here will be automatically added to your library according to the settings you have configured in CWA Settings page. All files placed here are REMOVED AFTER PROCESSING
      - ./calibre/ingest:/cwa-book-ingest
      # If you don't have an existing library, CWA will automatically create one at the bind provided here
      - ./calibre//library:/calibre-library
      # If you use calibre plugins, you can bind your plugins folder here to have CWA attempt to add them to its workflow (WIP)
      # If you are starting with a fresh install, you also need to copy customize.py.json to the Calibre config volume above, in /path/to/config/folder/.config/calibre/customize.py.json, see the note below for more info
      - ./calibre/plugins:/config/.config/calibre/plugins
    ports:
      # Change the first number to change the port you want to access the Web UI, not the second
      - 8083:8083
    # If you set CWA_PORT_OVERRIDE to a port below 1024, you may need to uncomment the following line:
    # cap_add:
    #   - NET_BIND_SERVICE
    restart: unless-stopped
    labels:
      - homepage.group=Media
      - homepage.name=Calibre Web Automated
      - homepage.icon=calibre.png
      - homepage.href=http://tribbleshare.follow-inconnu.ts.net:8083/
      - homepage.description=Making Calibre-Web your dream, all-in-one self-hosted digital library solution.
      - homepage.widget.type=calibreweb
      - homepage.widget.url=http://tribbleshare.follow-inconnu.ts.net:8083/
      - homepage.widget.username=${CALIBRE_USERNAME}
      - homepage.widget.password=${CALIBRE_PASSWORD}
